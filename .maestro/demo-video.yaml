# Records a ~40s walkthrough. Same env vars as store-screenshots.yaml.
#   maestro test -e PERMANA_EMAIL=... -e PERMANA_PASSWORD=... -e OUT=store-assets/ios-iphone .maestro/demo-video.yaml
appId: id.permana.sales
---
- launchApp:
    clearState: true
# iOS Keychain survives clearState, so sign out if a previous run left a session.
- runFlow:
    when:
      visible: "More, tab.*"
    commands:
      - tapOn: "More, tab.*"
      - tapOn: ".*Sign out.*"
      - waitForAnimationToEnd
- startRecording: ${OUT}/demo
- waitForAnimationToEnd
- tapOn: "name@permana.net.id"
- waitForAnimationToEnd
- inputText: ${PERMANA_EMAIL}
- tapOn:
    text: "Password"
    index: 1
- waitForAnimationToEnd
- inputText: ${PERMANA_PASSWORD}
- tapOn:
    point: "50%,8%"
- tapOn: "Sign in"
- extendedWaitUntil:
    visible: "Pipeline, tab.*"
    timeout: 30000
- waitForAnimationToEnd
- scroll
- scroll
- tapOn: "Pipeline, tab.*"
- waitForAnimationToEnd
- scroll
- tapOn: "Schedule, tab.*"
- waitForAnimationToEnd
- tapOn: "More, tab.*"
- waitForAnimationToEnd
- tapOn: ".*Quotations.*"
- waitForAnimationToEnd
- swipe:
    start: 1%,50%
    end: 80%,50%
    duration: 400
- waitForAnimationToEnd
- tapOn: ".*Targets & reports.*"
- waitForAnimationToEnd
- scroll
- swipe:
    start: 1%,50%
    end: 80%,50%
    duration: 400
- waitForAnimationToEnd
- tapOn: ".*Products.*"
- waitForAnimationToEnd
- stopRecording
